<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Archive Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <header class="app-header">
      <div class="logo-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>Chat Archive Helper</span>
      </div>
      <span class="version-tag">v1.0 OSS</span>
    </header>

    <div class="target-tab-card" id="tab-status-card">
      <div class="pulse-indicator" id="pulse-dot"></div>
      <div class="tab-info">
        <div class="tab-title" id="tab-title">Checking Messenger Session...</div>
        <div class="tab-url" id="tab-url">Open messenger.com or facebook.com/messages</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="stat-messages">0</div>
        <div class="stat-label">Messages</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-photos">0</div>
        <div class="stat-label">Photos & Media</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Scroll & Capture Speed</label>
      <select id="scroll-speed" class="form-select">
        <option value="turbo" selected>⚡ Turbo Mode (5x - Instant Batch Jump)</option>
        <option value="fast">🚀 Fast Mode (2.5x - Quick Fetch)</option>
        <option value="normal">🐢 Normal Mode (1x - Safe & Steady)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Export Format</label>
      <select id="export-format" class="form-select">
        <option value="html" selected>🌐 Offline HTML (Embedded Base64 Photos)</option>
        <option value="zip">📦 Full ZIP Archive (HTML + Images Folder)</option>
        <option value="json">📄 Structured JSON Data</option>
        <option value="txt">📝 Plain Text Transcript</option>
      </select>
    </div>

    <div class="form-group row-group">
      <label for="toggle-embed" class="toggle-label">Embed Base64 Offline Images</label>
      <input type="checkbox" id="toggle-embed" class="toggle-input" checked>
    </div>

    <div class="action-buttons">
      <button class="btn btn-primary" id="btn-start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Start Auto-Scroll & Capture
      </button>

      <div class="btn-group-dual" id="dual-controls" style="display: none;">
        <button class="btn btn-secondary" id="btn-pause">Pause</button>
        <button class="btn btn-success" id="btn-export">Export Now</button>
      </div>

      <button class="btn btn-secondary" id="btn-reset" style="margin-top: 6px; font-size: 11px; padding: 6px;">
        🔄 Reset Session (Clear Cached Msgs)
      </button>
    </div>

    <div class="status-footer" id="status-footer">
      Ready. Open any Messenger conversation to begin.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
