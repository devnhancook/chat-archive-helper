<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger Chat Offline Viewer</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-msg-in: #1e293b;
      --bg-msg-out: linear-gradient(135deg, #0084ff, #0066cc);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #0084ff;
    }

    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-card: #ffffff;
      --bg-msg-in: #e2e8f0;
      --bg-msg-out: linear-gradient(135deg, #0084ff, #0066cc);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: rgba(0, 0, 0, 0.1);
      --accent: #0084ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-info h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .header-info p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 20px;
      outline: none;
      font-size: 13px;
      width: 220px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      width: 280px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      margin: auto;
      color: var(--text-secondary);
    }

    .empty-state h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .file-dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      padding: 40px 20px;
      margin-top: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-dropzone:hover {
      border-color: var(--accent);
      background: rgba(0, 132, 255, 0.05);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 70%;
    }

    .msg-row.outgoing {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.incoming {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 2px;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-row.incoming .msg-bubble {
      background: var(--bg-msg-in);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .msg-row.outgoing .msg-bubble {
      background: var(--bg-msg-out);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-media {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .msg-media img {
      max-width: 260px;
      max-height: 260px;
      border-radius: 12px;
      object-fit: cover;
      cursor: pointer;
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 3px;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-info">
      <h1 id="chat-title">Messenger Chat Archive Viewer</h1>
      <p id="chat-meta">Open exported chat.json to view offline transcript</p>
    </div>
    <div class="controls">
      <input type="text" id="search-box" class="search-input" placeholder="Search messages..." style="display: none;">
      <button class="btn" onclick="document.getElementById('file-input').click()">Open JSON</button>
      <button class="btn" onclick="toggleTheme()">Toggle Theme</button>
      <input type="file" id="file-input" accept=".json" style="display: none;">
    </div>
  </header>

  <main id="chat-container">
    <div class="empty-state">
      <h2>Welcome to Messenger Chat Viewer</h2>
      <p>Load an exported JSON file to view full chat history with photos & media</p>
      <div class="file-dropzone" onclick="document.getElementById('file-input').click()">
        Click here or drop your exported chat.json file
      </div>
    </div>
  </main>

  <script>
    let activeMessages = [];

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          document.getElementById('chat-title').innerText = data.title || file.name;
          document.getElementById('chat-meta').innerText = `Exported ${new Date(data.exportedAt || Date.now()).toLocaleString()} • ${data.messages?.length || 0} messages`;
          document.getElementById('search-box').style.display = 'block';

          activeMessages = data.messages || [];
          renderMessages();
        } catch (err) {
          alert('Invalid JSON chat export file!');
        }
      };
      reader.readAsText(file);
    });

    function renderMessages(filterText = '') {
      const container = document.getElementById('chat-container');
      container.innerHTML = '';

      const query = filterText.toLowerCase();

      activeMessages.forEach(msg => {
        if (query && !msg.text.toLowerCase().includes(query) && !msg.sender.toLowerCase().includes(query)) {
          return;
        }

        const row = document.createElement('div');
        row.className = 'msg-row ' + (msg.isOutgoing ? 'outgoing' : 'incoming');

        let html = '';
        if (!msg.isOutgoing) {
          html += `<div class="msg-sender">${escapeHTML(msg.sender)}</div>`;
        }

        if (msg.text) {
          html += `<div class="msg-bubble">${escapeHTML(msg.text)}</div>`;
        }

        if (msg.images && msg.images.length > 0) {
          html += '<div class="msg-media">';
          msg.images.forEach(img => {
            html += `<img src="${img.dataUrl || img.src}" alt="Photo">`;
          });
          html += '</div>';
        }

        if (msg.timestamp) {
          html += `<div class="msg-time">${escapeHTML(msg.timestamp)}</div>`;
        }

        row.innerHTML = html;
        container.appendChild(row);
      });
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function toggleTheme() {
      const body = document.body;
      const current = body.getAttribute('data-theme');
      body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
    }

    document.getElementById('search-box').addEventListener('input', (e) => {
      renderMessages(e.target.value);
    });
  </script>
</body>
</html>
